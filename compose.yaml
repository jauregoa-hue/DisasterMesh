services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-disastermesh}
      POSTGRES_USER: ${POSTGRES_USER:-disastermesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1 first}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
  backend:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-disastermesh}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-disastermesh}
      JWT_SECRET: ${JWT_SECRET:?Run scripts/setup.ps1 first}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?Run scripts/setup.ps1 first}
      MESHTASTIC_ALLOWED_NODES: ${MESHTASTIC_ALLOWED_NODES:-!0436bda8}
      GPS_MAX_AGE_SECONDS: ${GPS_MAX_AGE_SECONDS:-300}
      AI_MODE: ${AI_MODE:-rules}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:1b}
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
    networks: [internal,public]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    extra_hosts:
      - 'host.docker.internal:host-gateway'
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:-}
    restart: unless-stopped
    ports:
      - '127.0.0.1:5173:80'
    depends_on:
      backend:
        condition: service_healthy
    networks: [public]
volumes:
  pgdata:
networks:
  internal:
    internal: true
  public: {}
